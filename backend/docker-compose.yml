services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gharswap
      POSTGRES_USER: gharswap
      POSTGRES_PASSWORD: gharswap
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      DJANGO_SECRET_KEY: local-docker-secret
      DJANGO_DEBUG: "true"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,web
      DATABASE_URL: postgres://gharswap:gharswap@db:5432/gharswap
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      PORT: "8000"
    depends_on:
      - db
    volumes:
      - .:/app

volumes:
  pgdata:
